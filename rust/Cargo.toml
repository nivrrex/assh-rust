[package]
name = "assh"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
cbc = { version = "0.2.1", features = ["alloc"] }
libc = "0.2.190"
md-5 = "0.11.0"
nix = { version = "0.31.3", features = ["term", "signal", "process", "fs"] }
rand = "0.10.3"
rpassword = "7.5.4"
rsa = "0.9.10"
russh = "0.64.1"
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }

[profile.release]
strip = true
